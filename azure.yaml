# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: karsus-initiative

services:
  web:
    project: .
    dist: dist
    language: ts
    host: staticwebapp

hooks:
  preprovision:
    shell: pwsh
    run: |
      Write-Host "No pre-provision steps required"
  predeploy:
    shell: pwsh
    run: |
      npm ci
      npm run build
      Push-Location api
      npm ci
      npm run build
      Pop-Location
  postdeploy:
    shell: pwsh
    run: |
      $swaName = az staticwebapp list `
        --resource-group $env:AZURE_RESOURCE_GROUP `
        --query "[0].name" `
        --output tsv
      if (-not $swaName) { Write-Error "Could not find Static Web App in resource group $env:AZURE_RESOURCE_GROUP"; exit 1 }
      $token = az staticwebapp secrets list `
        --name $swaName `
        --resource-group $env:AZURE_RESOURCE_GROUP `
        --query "properties.apiKey" `
        --output tsv
      if (-not $token) { Write-Error "Could not retrieve SWA deployment token"; exit 1 }
      npx --yes @azure/static-web-apps-cli deploy `
        --output-location dist `
        --api-location api `
        --api-language node `
        --api-version 20 `
        --deployment-token $token `
        --no-use-keychain `
        --env production

infra:
  provider: bicep
  path: infra
